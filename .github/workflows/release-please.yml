name: release-please

on:
  push:
    branches: [main]
  # rescue hatch: dispatch at a tag ref to publish a release the automatic
  # path missed
  workflow_dispatch:

# The release itself is created with GITHUB_TOKEN, whose events do not
# trigger other workflows — so publishing lives in this workflow, gated on
# the action's releases_created output.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v6
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@v7
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: npm ci
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
      - run: npm test
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
      - run: npm publish --provenance
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
